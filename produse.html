<!doctype html>
<html lang="ro">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CasaNova Design | Produse</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body data-page="products"><header id="site-header"></header><main><div id="hero"></div>
<section class="section catalog container"><h2 class="center">Catalog</h2><div class="catalog-layout">
<form class="filters" id="product-filters"><h3>Aplicare filtru</h3><fieldset><legend>Categorie</legend><label><input type="checkbox" name="category" value="Living"> Living</label><label><input type="checkbox" name="category" value="Bucătărie"> Bucătărie</label><label><input type="checkbox" name="category" value="Decorațiuni"> Decorațiuni</label></fieldset><fieldset><legend>Preț</legend><div class="price-fields"><label>de la<input type="number" name="min" min="0"></label><label>până la<input type="number" name="max" min="0"></label></div></fieldset><p class="filter-note">Mai multe filtre vor fi disponibile odată cu integrarea catalogului.</p><button class="button" type="submit">Aplicare filtru</button><button class="text-button" type="reset">Resetează</button></form>
<div id="catalog-results"></div></div></section></main><footer id="site-footer"></footer></body></html>
